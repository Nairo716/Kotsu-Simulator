<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首都圏交通シミュレーター（試作版）</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d232b; --sub:#5d6670; --line:#e2e0da;
  --accent:#0b6e4f; --accent-ink:#fff; --warn:#c0392b; --good:#1e7b3c; --chip:#efeee9;
  --shadow:0 2px 12px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#16191d;--panel:#1f2329;--ink:#e9ecef;--sub:#a0a8b1;--line:#343a42;--chip:#2a2f36;--accent:#3fb68b;--accent-ink:#0d1512;--shadow:0 2px 12px rgba(0,0,0,.5)}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:14px}
#map{position:absolute;inset:0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px}
.btn:hover{border-color:var(--sub)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--warn)}
.btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}

/* 上部バー */
#topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5}
#topbar>*{pointer-events:auto}
.card{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:8px 12px}
#company{font-weight:700}
#money{font-weight:700;font-variant-numeric:tabular-nums}
#money.neg{color:var(--warn)}
#clock{font-variant-numeric:tabular-nums}
.speed{display:flex;gap:4px}
.speed .btn{padding:4px 8px}
#status{color:var(--sub);font-size:12px}

/* 工具 */
#tools{position:absolute;left:10px;top:70px;bottom:30px;overflow:auto;display:flex;flex-direction:column;gap:5px;z-index:5;width:146px}
#tools>.small{margin-top:4px}
#tools select{font-size:12px;width:100%}
#tools .btn{text-align:left;width:100%}
#tools .key{float:right;color:var(--sub);font-size:11px}
#tools .btn.on .key{color:inherit}
.levels{display:flex;flex-direction:row;flex-wrap:wrap;gap:3px}
.levels .btn{flex:1 0 30%;text-align:center!important;padding:4px 0!important;white-space:nowrap}
.levels .btn{font-size:12px;padding:4px 8px}
.toolhint{font-size:12px;color:var(--sub);line-height:1.5}

/* 右パネル */
#panel{position:absolute;right:10px;top:70px;bottom:30px;width:340px;overflow:auto;z-index:5}
#panel h2{font-size:16px;margin:4px 0 8px}
#panel h3{font-size:13px;margin:14px 0 6px;color:var(--sub);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-variant-numeric:tabular-nums}
.kv>div:nth-child(odd){color:var(--sub)}
.kv>div:nth-child(even){text-align:right}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.linechip{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.list{display:flex;flex-direction:column;gap:4px}
.list .item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:8px;background:var(--chip);cursor:pointer}
.list .item:hover{outline:1px solid var(--sub)}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%}
.seg{display:grid;grid-template-columns:1fr 60px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.small{font-size:12px;color:var(--sub)}
.neg{color:var(--warn)} .pos{color:var(--good)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12px}
td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--sub);font-weight:500}
td:first-child,th:first-child{text-align:left}

#tip{position:absolute;z-index:15;pointer-events:none;background:var(--panel);color:var(--ink);border-radius:8px;box-shadow:var(--shadow);padding:6px 10px;font-size:12px;line-height:1.5;display:none;white-space:nowrap}
#tip b{font-size:13px}
#legend{position:absolute;left:170px;bottom:30px;z-index:5;font-size:12px;display:none}
#legend .grad{width:220px;height:10px;border-radius:5px;background:linear-gradient(90deg,#c62828,#ef6c00,#f9a825,#7cb342,#2e7d32);margin:4px 0}
#legend .ends{display:flex;justify-content:space-between;color:var(--sub)}
.badge{display:inline-flex;min-width:20px;height:20px;border-radius:10px;color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;padding:0 5px;margin-left:3px;cursor:pointer;vertical-align:middle}
.diagram{margin:6px 0}
.dstop{display:grid;grid-template-columns:30px 1fr auto;align-items:center;min-height:36px;position:relative}
.dbar{position:absolute;left:12px;width:6px;top:0;bottom:0}
.dstop.first .dbar{top:50%} .dstop.last .dbar{bottom:50%}
.dstop .dot{position:relative;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid;margin-left:8px;z-index:1}
.dstop .nm{font-weight:500;cursor:pointer}
.dstop .sub{font-size:11px;color:var(--sub)}
.dseg{position:relative;min-height:18px;padding-left:30px;font-size:11px;line-height:18px}
.pblock{display:flex;gap:14px;align-items:center;margin:6px 0}
.plegend{flex:1;font-size:12px}
.pl{display:flex;align-items:center;gap:6px;margin:2px 0}.pl i{width:10px;height:10px;border-radius:2px;display:inline-block}.pl b{margin-left:auto;font-variant-numeric:tabular-nums}
.prow{display:flex;justify-content:space-between;margin-top:8px;font-size:13px}
.bands{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px 0 6px}
.bcol{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--sub)}
.bbox{width:100%;height:34px;background:var(--chip);display:flex;align-items:flex-end;border-radius:3px;overflow:hidden}
.bbox i{display:block;width:100%}
.netbox{background:var(--chip);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
.netbox .code{font-size:18px;letter-spacing:2px;color:var(--accent)}
#netmap{position:absolute;inset:0;background:rgba(10,14,18,.45);z-index:26;display:none;align-items:center;justify-content:center}
.nmbox{width:calc(100vw - 40px);height:calc(100vh - 40px);display:flex;flex-direction:column}
.nmbox .diabody{flex:1;display:flex;flex-direction:column;min-height:0}
.nmwrap{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#faf6ef;border-radius:8px;cursor:grab}
#nmsvg path[data-line]{cursor:pointer}#nmsvg path[data-line]:hover{stroke-width:9}#nmsvg [data-st]{cursor:pointer}
#diagram{position:absolute;inset:0;background:rgba(10,14,18,.45);z-index:25;display:none;align-items:center;justify-content:center}
.diabox{max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow:auto;padding:12px 14px}
.diahead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.diahead>button{margin-left:auto}
.dlegs{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
.dleg{display:flex;align-items:center;gap:4px}.dleg i{width:16px;height:4px;border-radius:2px;display:inline-block}
.svc{border-left:5px solid;padding:4px 8px;margin:6px 0;background:var(--chip);border-radius:0 8px 8px 0}
.stops{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12px;margin-top:2px}
.stopchk{display:flex;align-items:center;gap:2px}.stopchk sup{color:var(--accent);font-size:9px}
.modalwrap{position:absolute;inset:0;background:rgba(10,14,18,.45);z-index:26;align-items:center;justify-content:center}
.sharebar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:4px 0}.sharebar i{display:block;height:100%}
.news{font-size:12px;line-height:1.6;max-height:140px;overflow:auto}
.pdiag{position:relative;margin:30px 0 6px}
.pdsvg{position:absolute;left:0;top:0;overflow:visible}
.drow{display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px dashed var(--line)}
.dname{font-size:13px;line-height:1.2}.dname .nm{cursor:pointer;font-weight:500}.dname .mk{color:var(--sub);font-size:11px;margin-left:3px}
.dname .sub{font-size:10px}
.dright{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.pax{font-variant-numeric:tabular-nums;font-size:12px;min-width:44px;text-align:right;color:var(--ink)}
.slhead{display:flex;gap:14px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);padding:4px 2px}
.slhead span{cursor:pointer}.slhead span.on{color:var(--ink);font-weight:700}
.sllist{max-height:calc(100vh - 330px);overflow:auto}
.slrow{display:flex;align-items:center;gap:6px;padding:5px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.slrow:hover{background:var(--chip)}
.slname{flex:0 0 auto;max-width:42%;font-size:13px}.slb{flex:1;display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end}
.tabs{display:flex;gap:4px;margin:6px 0}
.step{border-left:5px solid;padding:4px 8px;margin:4px 0;background:var(--chip);border-radius:0 8px 8px 0;font-size:13px}
.step.walk{border-color:var(--sub);border-left-style:dotted}
#toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13px}

/* 開始画面 */
#start{position:absolute;inset:0;background:rgba(10,14,18,.55);display:flex;align-items:center;justify-content:center;z-index:30}
#start .box{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:24px;max-width:560px;width:calc(100% - 32px)}
#start h1{font-size:22px;margin:0 0 4px}
#start p{line-height:1.7;color:var(--sub);margin:6px 0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mode{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--panel);text-align:left}
.mode b{display:block;font-size:15px;margin-bottom:4px}
.mode span{font-size:12px;color:var(--sub);line-height:1.6}
.mode.sel{border-color:var(--accent)}
.maplibregl-ctrl-attrib{font-size:11px}
@media (max-width:760px){
  #panel{top:auto;height:42%;left:10px;right:10px;width:auto;bottom:24px}
  #tools{top:auto;bottom:calc(42% + 34px);flex-direction:row;flex-wrap:wrap;width:auto;right:10px}
  #tools .btn{width:auto;padding:5px 8px}
  #tools .key,.toolhint,.levels .small{display:none}
  .levels{flex-direction:row;margin:0}
  #topbar{gap:6px} .card{padding:6px 10px} #status{display:none}
  .modes{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <div class="card"><span id="company">首都圏新交通</span></div>
  <div class="card">資金 <span id="money">-</span></div>
  <div class="card"><span id="clock">-</span></div>
  <div class="card speed">
    <button class="btn" data-speed="0" title="一時停止 (Space)">停止</button>
    <button class="btn" data-speed="1" title="1秒で1分">1分/秒</button>
    <button class="btn" data-speed="5" title="1秒で5分">5分/秒</button>
    <button class="btn" data-speed="30" title="1秒で30分">30分/秒</button>
    <button class="btn" data-speed="120" title="1秒で2時間">2時間/秒</button>
    <button class="btn" data-speed="720" title="1秒で12時間">12時間/秒</button>
  </div>
  <div class="card" id="status">準備中…</div>
  <div class="card" id="roomCode" style="display:none;font-weight:700"></div>
</div>

<div id="tools" class="card">
  <div class="small">鉄道</div>
  <button class="btn" data-tool="select">選択<span class="key">1</span></button>
  <button class="btn" data-tool="station">駅を建設<span class="key">2</span></button>
  <button class="btn" data-tool="track">線路を敷設<span class="key">3</span></button>
  <button class="btn" data-tool="line">路線を作成<span class="key">4</span></button>
  <button class="btn" data-tool="passage" title="離れた駅どうしを通路で結んで、乗り換えられるようにします">連絡通路</button>
  <div class="levels">
    <button class="btn" data-level="0" title="ふつうの鉄道">在来線</button>
    <button class="btn" data-level="2" title="路面電車（LRT）：安いが最高40km/h・3両まで。高さは0だけ">路面</button>
    <button class="btn" data-level="3" title="高速鉄道（新幹線）：専用の線路と駅。最高300km/h">高速</button>
  </div>
  <select id="hSel" title="線路・駅の高さ。同じ高さの線路どうしは交差できません">
    <option value="3">高さ +3（高い高架）</option><option value="2">高さ +2（高架）</option><option value="1">高さ +1（高架）</option>
    <option value="0" selected>高さ 0（地上）</option>
    <option value="-1">高さ −1（地下）</option><option value="-2">高さ −2（地下）</option><option value="-3">高さ −3（深い地下）</option>
  </select>
  <div style="display:none">
  </div>
  <div class="levels">
    <button class="btn" data-gauge="2" title="複線の線路・2線の駅">複線</button>
    <button class="btn" data-gauge="1" title="建設費は半分。単線を通る路線は列車の本数が半分になります">単線</button>
    <button class="btn" data-gauge="4" title="建設費は1.8倍。普通と優等列車が別の線路を走り、追い越しや増発ができます">複々線</button>
  </div>
  <select id="radius" title="曲線半径"><option value="auto">カーブ：自動（大きく）</option><option value="2000">カーブ：R2000m</option><option value="1000">カーブ：R1000m</option><option value="600">カーブ：R600m</option><option value="300">カーブ：R300m</option><option value="160">カーブ：R160m</option></select>
  <label class="small" style="display:flex;align-items:center;gap:4px;margin:2px 0" title="駅と駅をクリックすると、地図にある実在の線路に沿って線路を敷きます"><input type="checkbox" id="snapReal"> 実在の線路に沿わせる</label>
  <div class="small">バス</div>
  <button class="btn" data-tool="busstop">バス停を設置<span class="key">5</span></button>
  <button class="btn" data-tool="busline">バス路線を作成<span class="key">6</span></button>
  <div class="small">船・貨物</div>
  <button class="btn" data-tool="port">港を建設</button>
  <button class="btn" data-tool="ferryline">航路を作成</button>
  <button class="btn" data-tool="depot">貨物ターミナル</button>
  <button class="btn" data-tool="truckline">トラック便</button>
  <button class="btn" data-tool="freightline">貨物列車</button>
  <div class="small">調べる</div>
  <button class="btn" data-tool="route">乗換案内<span class="key">7</span></button>
  <button class="btn" data-tool="stlist">駅一覧<span class="key">0</span></button>
  <button class="btn" data-netmap="1">路線図（全体）<span class="key">M</span></button>
  <button class="btn" data-zones="1">地域の移動量<span class="key">9</span></button>
  <select id="colorMode" title="路線の色"><option value="line">路線の色：路線色</option><option value="profit">路線の色：収支</option></select>
  <button class="btn" data-tool="remove">撤去<span class="key">8</span></button>
  <div class="toolhint" id="toolhint"></div>
</div>

<div id="panel" class="card"></div>
<div id="toast"></div>
<div id="result" class="modalwrap" style="display:none"><div class="card resbody" style="min-width:320px;max-width:480px"></div></div>
<div id="netmap"><div class="diabox card nmbox"><div class="diahead"></div><div class="diabody"></div></div></div>
<div id="diagram"><div class="diabox card"><div class="diahead"></div><div class="diabody"></div></div></div>
<div id="tip"></div>
<div id="legend" class="card"><b>路線の収支（営業係数）</b><div class="grad"></div><div class="ends"><span>200〜 赤字</span><span>100</span><span>黒字 〜60</span></div></div>

<div id="start">
  <div class="box">
    <h1>首都圏交通シミュレーター<span class="small">（試作版）</span></h1>
    <p>実際の地図の上に駅と線路をつくり、路線を走らせて乗客を運びましょう。乗客の数は、地図データの建物から推定した人口と働く場所をもとに計算されます。</p>
    <div class="modes">
      <button class="mode sel" data-mode="blank"><b>白紙モード</b><span>鉄道がない首都圏から始めます。自分だけの鉄道網をゼロから作れます。</span></button>
      <button class="mode" data-mode="real"><b>現実モード</b><span>実在の鉄道を地図に表示します。<br>JR・私鉄・地下鉄などの既存の鉄道と乗客を奪い合います。</span></button>
    </div>
    <div class="row">会社名 <input id="companyInput" value="首都圏新交通" maxlength="20">　地域 <select id="regionSel"></select></div>
    <div class="row">初期資金 <select id="moneySel"></select></div>
    <div class="row" style="margin-top:14px">
      <button class="btn primary" id="newGame">ひとりで始める</button>
      <button class="btn" id="hostGame">部屋を作って招待する</button>
      <button class="btn" id="continueGame" style="display:none">続きから</button>
      <label class="btn">ファイルから読み込む<input type="file" id="loadFile" accept=".json" hidden></label>
    </div>
    <div class="row" style="margin-top:8px">招待コード <input id="joinCode" maxlength="8" placeholder="ABC123" style="width:110px;text-transform:uppercase"><button class="btn" id="joinGame">招待コードで参加</button></div>
    <p class="small">地図：OpenFreeMap / OpenMapTiles / OpenStreetMap contributors</p>
  </div>
</div>
<script id="worker-src" type="text/plain">
// ===== 需要計算ワーカー =====
// OpenFreeMap の z14 ベクタータイル（建物・土地利用）から 500m メッシュの人口・従業者を推定し、
// 通勤・私用の移動需要と、鉄道の利用者数・混雑・運賃収入を計算する。
'use strict';
let TILE_URL = null;
const Z = 14;
const LAT_STEP = 15 / 3600, LON_STEP = 22.5 / 3600; // JIS 2分の1地域メッシュ(500m)相当
const tiles = new Map();   // "x/y" -> Promise
const cells = new Map();   // key -> {i,j,lat,lon,pop,jobs}
let cellsDirty = false;
let latestVer = 0;

const P = {
  walkSpeed: 75,        // m/分（4.5km/h）
  walkDetour: 1.3,
  catchR: 1200,         // 駅勢圏（m）
  board: 3,             // 乗車ごとの抵抗（分）＝乗換抵抗
  vot: 30,              // 時間価値（円/分）
  theta: 0.08,          // ロジットの感度
  railBonus: 3,         // 鉄道の定時性などへの好み（分）
  lamC: 10, lamP: 3,    // 距離減衰（km）
  bgJobs: 2500,         // 読み込み範囲外の背景従業者密度（人/km²）
  workerRate: 0.45, privRate: 0.5,
  peakShare: 0.28,      // 通勤のうち朝ピーク1時間に集中する割合
  trainCap: 1500,       // 1編成の定員（10両）
};

// ---------- タイル座標 ----------
const lon2tile = lon => Math.floor((lon + 180) / 360 * 2 ** Z);
const lat2tile = lat => { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** Z); };
const tile2lon = x => x / 2 ** Z * 360 - 180;

  parse(text, add) {

// 他社の路線が自社の路線と「同じ区間」を走っているか：自社の駅から800m以内に他社の駅がある駅が2つ以上
function competitors(L) {
  const me = L.owner ?? 1, out = [];

$('#moneySel').innerHTML = Object.keys(START_MONEY).map(r => `<option ${r.startsWith('ふつう') ? 'selected' : ''}>${r}</option>`).join('');
$('#continueGame').addEventListener('click', () => { const s = loadSaved(); if (s) startGame(s, s.companies ? (s.me || s.companies[0].id) : 1); });
$('#loadFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const g = JSON.parse(await f.text()); if (!g.stations || !g.tracks || !g.lines) throw 0; startGame(g, g.companies ? g.companies[0].id : 1); toast('読み込みました'); } catch (err) { toast('読み込めないファイルです'); }
  e.target.value = '';
});
document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => G && setTool(b.dataset.tool)));
document.querySelector('[data-zones]').addEventListener('click', () => G && showZones(!ui.zones.on));
document.querySelector('[data-netmap]').addEventListener('click', () => openNetMap());
document.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => setLevel(+b.dataset.level)));
document.querySelectorAll('[data-gauge]').forEach(b => b.addEventListener('click', () => setGauge(b.dataset.gauge)));
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => setSpeed(+b.dataset.speed)));
$('#hSel').addEventListener('change', e => { ui.h = +e.target.value; e.target.blur(); updateHint(); renderPreview(); }); // 選んだらショートカットキーが効くようにフォーカスを外す
$('#snapReal').addEventListener('change', e => { ui.snapReal = e.target.checked; updateHint(); });
$('#radius').addEventListener('change', e => { ui.radius = e.target.value === 'auto' ? 'auto' : +e.target.value; renderPreview(); updateHint(); });
$('#colorMode').addEventListener('change', e => { ui.colorMode = e.target.value; renderNetwork(); });
// 入力が終わったら、待たせていた描き直しをする
$('#panel').addEventListener('focusout', () => setTimeout(() => { if (ui.panelDirty && !typingIn(document.activeElement)) renderPanel(); }, 0));
document.addEventListener('keydown', e => {
  // Ctrl+Z：元に戻す　Ctrl+Y／Ctrl+Shift+Z：やり直す（Macは⌘）
  if (G && (e.ctrlKey || e.metaKey) && !e.altKey && !e.isComposing && $('#start').style.display === 'none' && !typingIn(e.target) && !typingIn(document.activeElement)) {
    const k = e.key.toLowerCase();
    if (k === 'z' || k === 'y') { e.preventDefault(); undoRedo(k === 'y' || e.shiftKey); return; }
  }
  // 文字入力中（日本語の変換中を含む）や、Ctrl・⌘・Altとの組み合わせはショートカットにしない
  if (!G || e.isComposing || e.keyCode === 229 || e.ctrlKey || e.metaKey || e.altKey) return;
  if (typingIn(e.target) || typingIn(document.activeElement)) return;
  if ($('#start').style.display !== 'none') return; // タイトル画面では使わない
  const tools = { '1': 'select', '2': 'station', '3': 'track', '4': 'line', '5': 'busstop', '6': 'busline', '7': 'route', '8': 'remove', '0': 'stlist' };
  if (tools[e.key]) setTool(tools[e.key]);
  else if (e.key === '9') showZones(!ui.zones.on);
  else if (e.key === 'm' || e.key === 'M') { const b = $('#netmap'); if (b.style.display === 'flex') b.style.display = 'none'; else openNetMap(); }
  else if (e.key === 'Escape' && $('#netmap').style.display === 'flex') $('#netmap').style.display = 'none';
  else if (e.key === 'Escape') { if (ui.drawing) { ui.drawing = null; renderPreview(); updateHint(); } else if (ui.tool !== 'select') setTool('select'); else { ui.sel = null; renderNetwork(); renderZones(); renderPanel(); } }
  else if (e.key === 'Backspace' && ui.drawing) { e.preventDefault(); ui.drawing.pts.pop(); renderPreview(); }
  else if (e.key === 'Enter' && ui.lineBuild) confirmLine();
  else if (e.key === 'Enter' && ui.drawing && ui.tool === 'track' && ui.drawing.pts.length) { const q = ui.drawing.pts.pop(); finishTrack({ ll: [Math.round(q[0] * 1e6) / 1e6, Math.round(q[1] * 1e6) / 1e6] }); } // 最後にクリックした地点で線路を止める
  else if (e.key === ' ') { e.preventDefault(); setSpeed(ui.speed ? 0 : 1); }
});
// 参加者がページを閉じる・タイトルに戻るときは、ホストに「抜けます」と伝える
function leaveRoom() { if (NET.role === 'client' && NET.hostConn?.open) { try { NET.hostConn.send({ t: 'bye' }); } catch (e) { } } }
window.addEventListener('pagehide', leaveRoom);
window.addEventListener('beforeunload', () => { if (G && $('#start').style.display === 'none') save(true); });

// 起動：背景に地図を出して開始画面を表示
initMap(loadSaved()?.view);
showStart();
requestAnimationFrame(frame);
</script>
</body></html>
